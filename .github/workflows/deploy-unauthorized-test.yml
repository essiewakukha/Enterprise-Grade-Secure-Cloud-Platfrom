# SCENARIO 3 TEST HARNESS - CI/CD Abuse Attempt
#
# Run this manually from a feature branch (NOT main) or from a fork to
# demonstrate that OIDC federation rejects the assume-role call. The trust
# policy's `sub` condition in oidc.tf only matches
# "repo:<org>/<repo>:ref:refs/heads/main" -- any other branch, fork, or repo
# produces an STS "AccessDenied" / "Not authorized to perform sts:AssumeRoleWithWebIdentity"
# error, which is the deliverable evidence for this scenario. Capture the
# Actions log output as your screenshot/log artifact.
name: OIDC Unauthorized Access Test

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  attempt-unauthorized-assume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attempt to assume deploy role from non-main ref
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<PRODUCTION_ACCOUNT_ID>:role/GitHubActionsDeployRole
          aws-region: af-south-1
          role-session-name: unauthorized-test-${{ github.run_id }}

      - name: "Report result (expected: denied)"
        run: |
          if [ "${{ steps.assume.outcome }}" = "failure" ]; then
            echo "EXPECTED RESULT: sts:AssumeRoleWithWebIdentity was denied."
            echo "OIDC trust policy correctly rejected ref: ${{ github.ref }}"
          else
            echo "UNEXPECTED: assume-role succeeded from an unauthorized ref. Review oidc.tf trust condition."
            exit 1
          fi