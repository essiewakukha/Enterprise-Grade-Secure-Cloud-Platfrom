# Deploys the 04-appsec layer via OIDC-federated, temporary AWS credentials.
# No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY anywhere in this workflow.
# This action exchanges the GitHub-issued OIDC JWT for short-lived AWS STS
# credentials scoped to GitHubActionsDeployRole. Credentials exist only in
# the job's environment and expire automatically -- nothing to rotate,
# nothing to leak.
name: Deploy Infrastructure (OIDC)

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required to request the OIDC JWT from GitHub
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::353362989916:role/GitHubActionsDeployRole

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Debug - decode actual OIDC token claims
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, actor}' || \
          echo "$IDTOKEN" | cut -d. -f2 | base64 --decode 2>/dev/null | python3 -m json.tool
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}


      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: Verify identity (proof of temporary credentials)
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Init
        working-directory: terraform/appsec
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/appsec
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/appsec
        run: terraform apply -auto-approve tfplan